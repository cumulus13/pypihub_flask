name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel into a clean virtualenv and smoke test it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$(ls dist/*.whl)[flask]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/.github/scripts/smoke_wheel.py"
          "$RUNNER_TEMP/venv/bin/pypihub" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: pypihub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the container and check it
        run: |
          docker run -d --name pypihub -p 5000:5000 \
            -e PYPIHUB_ADMIN_USER=ci -e PYPIHUB_ADMIN_PASSWORD=ci-password-123 pypihub:ci
          status=starting
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' pypihub)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs pypihub
          test "$status" = healthy
          test "$(docker exec pypihub id -u)" = 10001
          curl -fsS http://127.0.0.1:5000/healthz
          curl -fsS http://127.0.0.1:5000/ | grep -q "Python packages, served locally."
          curl -fsS -o /dev/null http://127.0.0.1:5000/static/css/pypihub.css
          printf 'ci' > ci_demo-1.0.tar.gz
          curl -fsS -o /dev/null -u ci:ci-password-123 -F "file=@ci_demo-1.0.tar.gz" http://127.0.0.1:5000/
          curl -fsS http://127.0.0.1:5000/simple/ci-demo/ | grep -q ci_demo-1.0.tar.gz
          curl -fsS http://127.0.0.1:5000/project/ci-demo/ | grep -q ci_demo-1.0.tar.gz
      - name: Container logs on failure
        if: failure()
        run: docker logs pypihub || true
