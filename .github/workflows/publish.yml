name: Publish to PyPI

# Publishing a GitHub release uploads it to PyPI through trusted publishing (no API token stored).
# One-time setup on PyPI: Project settings > Publishing > add a GitHub publisher with
#   owner: cumulus13, repository: pypihub_flask, workflow: publish.yml, environment: pypi
# Running the workflow by hand only builds and checks the distributions.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Release tag must match __version__.py
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, re, sys
          declared = re.search(r'version\s*=\s*"([^"]+)"', open("__version__.py", encoding="utf-8").read()).group(1)
          tag = os.environ["TAG"].lstrip("v")
          if tag != declared:
              sys.exit(f"Release tag {tag!r} does not match __version__.py {declared!r}")
          print("version", declared)
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pypihub
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
