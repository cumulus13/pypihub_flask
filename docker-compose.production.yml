# A public-facing deployment: PostgreSQL for the catalog and accounts, Redis for the shared cache and rate limits.
#
#   cp .env.example .env     # set the passwords, at least PYPIHUB_ADMIN_* and POSTGRES_PASSWORD
#   docker compose -f docker-compose.production.yml up -d
#
# Put a reverse proxy with TLS (Caddy, nginx, Traefik) in front and set PYPIHUB_TRUST_PROXY=1.
services:
  pypihub:
    image: ghcr.io/cumulus13/pypihub_flask:latest
    restart: unless-stopped
    ports:
      - "${PYPIHUB_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://pypihub:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/pypihub"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "${PYPIHUB_SECRET_KEY:-}"
      PYPIHUB_ADMIN_USER: "${PYPIHUB_ADMIN_USER:-}"
      PYPIHUB_ADMIN_PASSWORD: "${PYPIHUB_ADMIN_PASSWORD:-}"
      PYPIHUB_TRUST_PROXY: "${PYPIHUB_TRUST_PROXY:-1}"
      PYPI_SIMPLE_URL: "${PYPI_SIMPLE_URL:-https://pypi.org/simple}"
      # Stop the cache from filling the disk: new files are streamed but not stored once this is reached.
      # `docker compose exec pypihub pypihub prune --max-size 80GB` (daily, from cron) removes the oldest files.
      PYPIHUB_CACHE_MAX_SIZE: "${PYPIHUB_CACHE_MAX_SIZE:-100GB}"
      PYPIHUB_RATE_LIMIT_DEFAULT: "${PYPIHUB_RATE_LIMIT_DEFAULT:-1200 per minute}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-8}"
      # 4 workers x (10 + 20) connections = 120 at most; PostgreSQL allows 100 by default and is raised below.
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
    volumes:
      - pypihub-data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: pypihub
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: pypihub
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pypihub -d pypihub"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Only cache and counters live here, so losing it costs nothing but warm-up time.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pypihub-data:
  postgres-data:
