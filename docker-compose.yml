# docker compose up -d
# Copy .env.example to .env first and set the values you need.
services:
  pypihub:
    build: .
    image: ghcr.io/cumulus13/pypihub_flask:latest
    container_name: pypihub
    restart: unless-stopped
    ports:
      - "${PYPIHUB_PORT:-5000}:5000"
    environment:
      SECRET_KEY: "${PYPIHUB_SECRET_KEY:-}"
      PYPIHUB_ADMIN_USER: "${PYPIHUB_ADMIN_USER:-}"
      PYPIHUB_ADMIN_PASSWORD: "${PYPIHUB_ADMIN_PASSWORD:-}"
      PYPIHUB_TRUST_PROXY: "${PYPIHUB_TRUST_PROXY:-}"
      PYPI_SIMPLE_URL: "${PYPI_SIMPLE_URL:-https://pypi.org/simple}"
    volumes:
      - pypihub-data:/data

volumes:
  pypihub-data:
